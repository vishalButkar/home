let current="all";

let currentPhotos=[];

let photoIndex=0;

let cardPhotoIndexes={};



/* ================= FILTER ================= */

function filterEvents(type,button){

    current=type;

    document
    .querySelectorAll(".filters button")
    .forEach(
        b=>b.classList.remove("active")
    );

    button.classList.add("active");

    display();

}



/* ================= SEARCH ================= */

document
.getElementById("search")
.addEventListener(
"input",
display
);



/* ================= DISPLAY ================= */

function display(){


    let keyword=
    document
    .getElementById("search")
    .value
    .toLowerCase();


    let list=
    data.filter(e=>

        (current=="all" ||
        e.type==current)

        &&

        Object.values(e)
        .join(" ")
        .toLowerCase()
        .includes(keyword)

    );


    document
    .getElementById("events")
    .innerHTML=

    list.map((e,index)=>{


        if(cardPhotoIndexes[e.id]===undefined){

            cardPhotoIndexes[e.id]=0;

        }


        let photo=
        e.photos[
            cardPhotoIndexes[e.id]
        ];


        return `

        <article class="card">


            <!-- NUMBER -->

            <div class="event-number">

                #${String(e.id).padStart(2,"0")}

            </div>


            <!-- PHOTO -->

            <div class="gallery">


                <img
                id="photo-${e.id}"
                src="${photo}"
                alt="${e.title}"
                onclick="openPhoto(${e.id})">


                ${
                    e.photos.length>1

                    ?

                    `

                    <button
                    class="prev"
                    onclick="cardPhoto(${e.id},-1)">

                    ‹

                    </button>


                    <button
                    class="next"
                    onclick="cardPhoto(${e.id},1)">

                    ›

                    </button>


                    <div class="photo-count">

                    📷 ${e.photos.length} Photos

                    </div>

                    `

                    :

                    ""

                }

            </div>


            <!-- CONTENT -->

            <div class="content">


                <span class="type">

                    ${getType(e.type)}

                </span>


                <div class="date">

                    📅 ${e.date}

                </div>


                <h2>

                    ${e.title}

                </h2>


                <p class="topic">

                    ${e.topic}

                </p>


                <p class="description">

                    ${e.description}

                </p>


                <div class="info">

                    🏢 ${e.institution}

                    <br>

                    📍 ${e.venue}

                    <br>

                    🌐 ${e.location}

                </div>


                ${
                    e.link

                    ?

                    `

                    <a
                    class="details"
                    href="${e.link}"
                    target="_blank"
                    rel="noopener">

                    View Details →

                    </a>

                    `

                    :

                    ""

                }


            </div>


        </article>

        `;

    }).join("");

}



/* ================= TYPE ================= */

function getType(type){

    const names={

        expert:"🎤 EXPERT SESSION",

        conference:"🎙️ CONFERENCE SPEAKER",

        workshop:"💻 FDP / WORKSHOP",

        award:"🏆 AWARD",

        news:"📰 NEWS ARTICLE",

        youtube:"▶️ YOUTUBE BITE"

    };

    return names[type] || "ACADEMIC EVENT";

}



/* ================= CARD PHOTOS ================= */

function cardPhoto(id,d){

    const event=
    data.find(e=>e.id===id);


    cardPhotoIndexes[id]+=d;


    if(
        cardPhotoIndexes[id]<0
    ){

        cardPhotoIndexes[id]=
        event.photos.length-1;

    }


    if(
        cardPhotoIndexes[id]>=
        event.photos.length
    ){

        cardPhotoIndexes[id]=0;

    }


    document
    .getElementById(
        "photo-"+id
    )
    .src=
    event.photos[
        cardPhotoIndexes[id]
    ];

}



/* ================= OPEN PHOTO ================= */

function openPhoto(id){

    const event=
    data.find(e=>e.id===id);


    currentPhotos=
    event.photos;

    photoIndex=
    cardPhotoIndexes[id] || 0;


    document
    .getElementById("modalImage")
    .src=
    currentPhotos[photoIndex];


    document
    .getElementById("modal")
    .style.display="flex";

}



/* ================= NEXT / PREVIOUS ================= */

function changePhoto(direction){

    photoIndex+=direction;


    if(photoIndex<0){

        photoIndex=
        currentPhotos.length-1;

    }


    if(
        photoIndex>=
        currentPhotos.length
    ){

        photoIndex=0;

    }


    document
    .getElementById("modalImage")
    .src=
    currentPhotos[photoIndex];

}



/* ================= CLOSE ================= */

function closePhoto(){

    document
    .getElementById("modal")
    .style.display="none";
    

}



/* ================= START ================= */

display();

</script>
