<style>

/* ================= BASIC ================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

a{
    text-decoration:none;
}


/* ================= NAVIGATION ================= */

nav{
    background:#071426;
    padding:18px;
    text-align:center;
}

nav a{
    color:white;
    margin:0 10px;
    font-size:13px;
}

nav a:hover{
    color:#20bfdc;
}


/* ================= HERO ================= */

.hero{
    background:linear-gradient(135deg,#071426,#12436b);
    color:white;
    text-align:center;
    padding:65px 20px;
}

.hero h1{
    font-size:42px;
    margin:10px;
}

.hero h1 span{
    color:#20bfdc;
}

.hero p{
    color:#b9c8d8;
    line-height:1.6;
}


/* ================= FILTER ================= */

.filters{
    text-align:center;
    padding:30px 10px;
}

.filters button{
    padding:10px 15px;
    margin:4px;
    border:1px solid #ddd;
    border-radius:20px;
    background:white;
    cursor:pointer;
}

.filters button:hover,
.filters button.active{
    background:#1769e0;
    color:white;
}

.search{
    display:block;
    width:90%;
    max-width:600px;
    margin:15px auto;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
}


/* ================= EVENT GRID ================= */

.events{
    max-width:1150px;
    margin:20px auto 70px;
    padding:10px;

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:22px;
}


/* ================= CARD ================= */

.card{
    position:relative;

    background:white;

    border-radius:15px;

    overflow:hidden;

    box-shadow:
    0 5px 20px #0001;

    transition:.3s;
}

.card:hover{
    transform:translateY(-6px);
}


/* ================= EVENT NUMBER ================= */

.event-number{

    position:absolute;

    top:12px;
    right:12px;

    z-index:5;

    background:#071426;

    color:#20bfdc;

    padding:7px 10px;

    border-radius:20px;

    font-size:11px;

    font-weight:bold;

    box-shadow:
    0 3px 12px #0005;

}


/* ================= PHOTO GALLERY ================= */

.gallery{

    position:relative;

    height:210px;

    background:#071426;

}

.gallery img{

    width:100%;

    height:100%;

    object-fit:cover;

    cursor:pointer;

}


.gallery button{

    position:absolute;

    top:50%;

    transform:
    translateY(-50%);

    width:35px;

    height:35px;

    border:0;

    border-radius:50%;

    background:#0009;

    color:white;

    font-size:22px;

    cursor:pointer;

    z-index:3;

}

.gallery button:hover{

    background:#1769e0;

}


.prev{
    left:10px;
}

.next{
    right:10px;
}


.photo-count{

    position:absolute;

    bottom:8px;

    right:10px;

    background:#000b;

    color:white;

    padding:5px 9px;

    border-radius:15px;

    font-size:10px;

}


/* ================= CARD CONTENT ================= */

.content{

    padding:18px;

}


.type{

    display:inline-block;

    background:#071426;

    color:white;

    padding:6px 10px;

    border-radius:15px;

    font-size:9px;

}


.date{

    color:#1769e0;

    font-size:12px;

    font-weight:bold;

    margin:10px 0;

}


h2{

    font-size:18px;

    line-height:1.4;

}


.topic{

    color:#1769e0;

    font-weight:bold;

    font-size:11px;

}


.info{

    color:#64748b;

    font-size:11px;

    line-height:1.9;

    margin-top:10px;

}


.description{

    color:#64748b;

    font-size:11px;

    line-height:1.6;

}


.details{

    display:inline-block;

    margin-top:10px;

    color:#1769e0;

    font-size:11px;

    font-weight:bold;

}


/* ================= FULL SCREEN PHOTO ================= */

.modal{

    display:none;

    position:fixed;

    inset:0;

    background:#000e;

    z-index:9999;

    align-items:center;

    justify-content:center;

}


.modal img{

    max-width:90%;

    max-height:85%;

    object-fit:contain;

}


.modal button{

    position:absolute;

    border:0;

    border-radius:50%;

    width:42px;

    height:42px;

    background:white;

    color:#111;

    font-size:22px;

    cursor:pointer;

}


.close{

    top:20px;

    right:25px;

}


.modal-prev{

    left:25px;

}


.modal-next{

    right:25px;

}


/* ================= FOOTER ================= */

footer{

    background:#071426;

    color:white;

    text-align:center;

    padding:30px;

}


/* ================= MOBILE ================= */

@media(max-width:850px){

    .events{

        grid-template-columns:
        repeat(2,1fr);

    }

}


@media(max-width:550px){

    .events{

        grid-template-columns:1fr;

    }

    .hero h1{

        font-size:32px;

    }

    nav a{

        display:inline-block;

        margin:5px;

    }

}

/* ==================================================
   DO NOT EDIT BELOW THIS LINE
================================================== */


let current="all";

let currentPhotos=[];

let photoIndex=0;

let cardPhotoIndexes={};



/* ================= FILTER ================= */

function filterEvents(type,button){

    current=type;

    document
    .querySelectorAll(".filters button")
    .forEach(
        b=>b.classList.remove("active")
    );

    button.classList.add("active");

    display();

}



/* ================= SEARCH ================= */

document
.getElementById("search")
.addEventListener(
"input",
display
);



/* ================= DISPLAY ================= */

function display(){


    let keyword=
    document
    .getElementById("search")
    .value
    .toLowerCase();


    let list=
    data.filter(e=>

        (current=="all" ||
        e.type==current)

        &&

        Object.values(e)
        .join(" ")
        .toLowerCase()
        .includes(keyword)

    );


    document
    .getElementById("events")
    .innerHTML=

    list.map((e,index)=>{


        if(cardPhotoIndexes[e.id]===undefined){

            cardPhotoIndexes[e.id]=0;

        }


        let photo=
        e.photos[
            cardPhotoIndexes[e.id]
        ];


        return `

        <article class="card">


            <!-- NUMBER -->

            <div class="event-number">

                #${String(e.id).padStart(2,"0")}

            </div>


            <!-- PHOTO -->

            <div class="gallery">


                <img
                id="photo-${e.id}"
                src="${photo}"
                alt="${e.title}"
                onclick="openPhoto(${e.id})">


                ${
                    e.photos.length>1

                    ?

                    `

                    <button
                    class="prev"
                    onclick="cardPhoto(${e.id},-1)">

                    ‹

                    </button>


                    <button
                    class="next"
                    onclick="cardPhoto(${e.id},1)">

                    ›

                    </button>


                    <div class="photo-count">

                    📷 ${e.photos.length} Photos

                    </div>

                    `

                    :

                    ""

                }

            </div>


            <!-- CONTENT -->

            <div class="content">


                <span class="type">

                    ${getType(e.type)}

                </span>


                <div class="date">

                    📅 ${e.date}

                </div>


                <h2>

                    ${e.title}

                </h2>


                <p class="topic">

                    ${e.topic}

                </p>


                <p class="description">

                    ${e.description}

                </p>


                <div class="info">

                    🏢 ${e.institution}

                    <br>

                    📍 ${e.venue}

                    <br>

                    🌐 ${e.location}

                </div>


                ${
                    e.link

                    ?

                    `

                    <a
                    class="details"
                    href="${e.link}"
                    target="_blank"
                    rel="noopener">

                    View Details →

                    </a>

                    `

                    :

                    ""

                }


            </div>


        </article>

        `;

    }).join("");

}



/* ================= TYPE ================= */

function getType(type){

    const names={

        expert:"🎤 EXPERT SESSION",

        conference:"🎙️ CONFERENCE SPEAKER",

        workshop:"💻 FDP / WORKSHOP",

        award:"🏆 AWARD",

        news:"📰 NEWS ARTICLE",

        youtube:"▶️ YOUTUBE BITE"

    };

    return names[type] || "ACADEMIC EVENT";

}



/* ================= CARD PHOTOS ================= */

function cardPhoto(id,d){

    const event=
    data.find(e=>e.id===id);


    cardPhotoIndexes[id]+=d;


    if(
        cardPhotoIndexes[id]<0
    ){

        cardPhotoIndexes[id]=
        event.photos.length-1;

    }


    if(
        cardPhotoIndexes[id]>=
        event.photos.length
    ){

        cardPhotoIndexes[id]=0;

    }


    document
    .getElementById(
        "photo-"+id
    )
    .src=
    event.photos[
        cardPhotoIndexes[id]
    ];

}



/* ================= OPEN PHOTO ================= */

function openPhoto(id){

    const event=
    data.find(e=>e.id===id);


    currentPhotos=
    event.photos;

    photoIndex=
    cardPhotoIndexes[id] || 0;


    document
    .getElementById("modalImage")
    .src=
    currentPhotos[photoIndex];


    document
    .getElementById("modal")
    .style.display="flex";

}



/* ================= NEXT / PREVIOUS ================= */

function changePhoto(direction){

    photoIndex+=direction;


    if(photoIndex<0){

        photoIndex=
        currentPhotos.length-1;

    }


    if(
        photoIndex>=
        currentPhotos.length
    ){

        photoIndex=0;

    }


    document
    .getElementById("modalImage")
    .src=
    currentPhotos[photoIndex];

}



/* ================= CLOSE ================= */

function closePhoto(){

    document
    .getElementById("modal")
    .style.display="none";

}



/* ================= START ================= */

display();

</script>
