let current="all";

function show(type,btn){

current=type;

document.querySelectorAll("button")
.forEach(b=>b.classList.remove("active"));

if(btn)btn.classList.add("active");

render();

}

document.getElementById("search")
.addEventListener("input",render);


function render(){

let word=document.getElementById("search")
.value.toLowerCase();

let list=data.filter(e=>

(current=="all"||e.type==current)&&

Object.values(e).join(" ")
.toLowerCase().includes(word)

);

document.getElementById("events").innerHTML=list.map(e=>`

<article class="card">

${e.photo
?`<img src="${e.photo}" alt="${e.title}">`
:`<div class="noimg">📸</div>`}

<div class="content">

<div class="date">📅 ${e.date}</div>

<div class="tag">${e.type.toUpperCase()}</div>

<h3>${e.title}</h3>

<p><b>${e.topic}</b></p>

<div class="info">
🏢 ${e.institution}<br>
📍 ${e.venue}<br>
🌐 ${e.location}
</div>

${e.link
?`<p><a class="link" href="${e.link}" target="_blank">
View Details →</a></p>`
:""}

</div>
</article>

`).join("");

}

render();
