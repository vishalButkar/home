<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Academic Activities | Dr. Umakant D. Butkar</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f8fc;color:#172033}
nav{background:#071426;padding:18px;text-align:center}
nav a{color:#fff;text-decoration:none;margin:0 12px;font-size:13px}
nav a:hover{color:#20bfdc}

.hero{text-align:center;padding:60px 20px;color:#fff;
background:linear-gradient(135deg,#071426,#123b61)}
.hero h1{font-size:42px;margin:10px}
.hero h1 span{color:#20bfdc}
.hero p{color:#b9c8d8}

.filters{text-align:center;padding:25px 10px}
button{border:1px solid #ddd;background:#fff;padding:10px 15px;
border-radius:20px;margin:4px;cursor:pointer}
button.active,button:hover{background:#1769e0;color:#fff}

.search{display:block;width:90%;max-width:600px;margin:15px auto;
padding:13px;border:1px solid #ddd;border-radius:8px}

.grid{max-width:1150px;margin:20px auto 70px;padding:10px;
display:grid;grid-template-columns:repeat(3,1fr);gap:22px}

.card{background:#fff;border-radius:15px;overflow:hidden;
box-shadow:0 5px 20px #0001;transition:.3s}
.card:hover{transform:translateY(-6px)}

.gallery{position:relative;height:210px;background:#071426}
.gallery img{width:100%;height:100%;object-fit:cover;cursor:pointer}

.gallery button{position:absolute;top:50%;transform:translateY(-50%);
background:#0009;color:#fff;border:0;width:35px;height:35px;
padding:0;border-radius:50%;z-index:2}
.prev{left:10px}.next{right:10px}

.count{position:absolute;bottom:8px;right:10px;
background:#000b;color:#fff;padding:5px 9px;border-radius:15px;font-size:10px}

.content{padding:18px}
.date{color:#1769e0;font-size:12px;font-weight:bold}
.tag{display:inline-block;background:#071426;color:#fff;
padding:5px 9px;border-radius:15px;font-size:9px;margin:8px 0}
h3{margin:8px 0;font-size:17px}
p{font-size:12px;line-height:1.6;color:#64748b}
.info{font-size:11px;line-height:1.8}
.link{color:#1769e0;font-weight:bold;font-size:11px}

/* FULL SCREEN PHOTO */
.modal{display:none;position:fixed;inset:0;background:#000e;
z-index:9999;align-items:center;justify-content:center}
.modal img{max-width:90%;max-height:85%;object-fit:contain}
.modal button{position:absolute;background:#fff;color:#111;
border:0;border-radius:50%;width:40px;height:40px;font-size:20px}
.close{top:20px;right:25px}
.modalPrev{left:25px}
.modalNext{right:25px}

footer{text-align:center;background:#071426;color:#fff;padding:30px}

@media(max-width:800px){
.grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:550px){
.grid{grid-template-columns:1fr}
.hero h1{font-size:32px}
}
</style>
</head>

<body>

<nav>
<a href="index.html">Home</a>
<a href="publications.html">Publications</a>
<a href="expert-sessions.html">Academic Activities</a>
</nav>

<section class="hero">
<p>ACADEMIC • RESEARCH • PROFESSIONAL ACTIVITIES</p>
<h1>Dr. Umakant <span>D. Butkar</span></h1>
<p>Expert Sessions • Conferences • Workshops • Awards • News</p>
</section>

<div class="filters">

<button class="active" onclick="filter('all',this)">All</button>
<button onclick="filter('expert',this)">🎤 Expert Sessions</button>
<button onclick="filter('conference',this)">🏛 Conferences</button>
<button onclick="filter('workshop',this)">💻 Workshops / FDP</button>
<button onclick="filter('award',this)">🏆 Awards</button>
<button onclick="filter('news',this)">📰 News</button>

<input class="search" id="search"
placeholder="🔎 Search activity, institution, venue...">

</div>

<div class="grid" id="events"></div>

<!-- PHOTO VIEWER -->

<div class="modal" id="modal">

<button class="close" onclick="closePhoto()">×</button>

<button class="modalPrev" onclick="changePhoto(-1)">‹</button>

<img id="modalImg">

<button class="modalNext" onclick="changePhoto(1)">›</button>

</div>

<footer>
<strong>Dr. Umakant D. Butkar</strong><br>
Academician • Researcher • Author • Innovator
</footer>


<script>

/* =====================================================
   ONLY EDIT THIS SECTION
   ADD NEW EVENTS HERE
===================================================== */

const data=[

{
type:"expert",
title:"Expert Session on Intellectual Property Rights",
topic:"Intellectual Property Rights",
date:"03 February 2025",
institution:"JES Institute of Technology, Management & Research",
venue:"Seminar Hall",
location:"Nashik, Maharashtra",

photos:[
"events/ipr-2025-1.jpg",
"events/ipr-2025-2.jpg",
"events/ipr-2025-3.jpg"
],

link:"https://www.jitnew.jitnashik.edu.in/department/IT/ITseminar.php"
},

{
type:"expert",
title:"Expert Panel Discussion on Internet of Things",
topic:"IoT • Smart Systems • Emerging Technologies",
date:"November 21st, 2025"
institution:"Academic Institution",
venue:"Conference Hall",
location:"Delhi, India",

photos:[
"events/paneliot.jpg",

],

link:"https://iotsocietyofindia.com/"
},

{
type:"conference",
title:"International Conference on Emerging Technologies",
topic:"Research • Innovation • Emerging Technologies",
date:"2024",
institution:"Conference Organizing Institution",
venue:"Conference Venue",
location:"Maharashtra, India",

photos:[
"events/conference-1.jpg",
"events/conference-2.jpg",
"events/conference-3.jpg"
],

link:""
},

{
type:"workshop",
title:"Faculty Development Programme",
topic:"Emerging Technologies & Research",
date:"2025",
institution:"Organizing Institution",
venue:"Institution Campus",
location:"Maharashtra, India",

photos:[
"events/fdp-1.jpg",
"events/fdp-2.jpg"
],

link:""
},

{
type:"award",
title:"Academic Excellence & Research Recognition",
topic:"Academic • Research • Innovation",
date:"2025",
institution:"Awarding Organization",
venue:"Award Ceremony",
location:"India",

photos:[
"events/award-1.jpg",
"events/award-2.jpg"
],

link:""
},

{
type:"news",
title:"Research & Innovation Featured in News",
topic:"Research • Innovation • Technology",
date:"2025",
institution:"News Publication",
venue:"Nashik",
location:"Maharashtra, India",

photos:[
"events/news-1.jpg"
],

link:""
}

];


/* =====================================================
   DO NOT EDIT BELOW
===================================================== */

let current="all";
let currentPhotos=[];
let photoIndex=0;

function filter(type,btn){

current=type;

document.querySelectorAll(".filters button")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

render();
}


document.getElementById("search")
.addEventListener("input",render);


function render(){

let word=document.getElementById("search")
.value.toLowerCase();

let list=data.filter(e=>
(current=="all"||e.type==current)&&
Object.values(e).join(" ").toLowerCase().includes(word)
);

document.getElementById("events").innerHTML=
list.map((e,i)=>`

<article class="card">

<div class="gallery">

<img id="img${i}"
src="${e.photos[0]}"
onclick="openPhoto(${i})">

${e.photos.length>1?`

<button class="prev"
onclick="cardPhoto(${i},-1)">‹</button>

<button class="next"
onclick="cardPhoto(${i},1)">›</button>

<div class="count">
📷 ${e.photos.length} Photos
</div>

`:""}

</div>

<div class="content">

<div class="date">📅 ${e.date}</div>

<div class="tag">${e.type.toUpperCase()}</div>

<h3>${e.title}</h3>

<p><b>${e.topic}</b></p>

<div class="info">
🏢 ${e.institution}<br>
📍 ${e.venue}<br>
🌐 ${e.location}
</div>

${e.link?
`<p><a class="link"
href="${e.link}"
target="_blank">
View Details →
</a></p>`:""}

</div>

</article>

`).join("");

}


/* CARD PHOTO */

let cardIndexes={};

function cardPhoto(i,d){

let list=data.filter(e=>
current=="all"||e.type==current);

let e=list[i];

if(!cardIndexes[i])
cardIndexes[i]=0;

cardIndexes[i]+=d;

if(cardIndexes[i]<0)
cardIndexes[i]=e.photos.length-1;

if(cardIndexes[i]>=e.photos.length)
cardIndexes[i]=0;

document.getElementById("img"+i).src=
e.photos[cardIndexes[i]];

}


/* FULL SCREEN */

function openPhoto(i){

let list=data.filter(e=>
current=="all"||e.type==current);

currentPhotos=list[i].photos;

photoIndex=0;

document.getElementById("modalImg").src=
currentPhotos[photoIndex];

document.getElementById("modal").style.display="flex";

}


function changePhoto(d){

photoIndex+=d;

if(photoIndex<0)
photoIndex=currentPhotos.length-1;

if(photoIndex>=currentPhotos.length)
photoIndex=0;

document.getElementById("modalImg").src=
currentPhotos[photoIndex];

}


function closePhoto(){

document.getElementById("modal")
.style.display="none";

}


render();

</script>

</body>
</html>
