body {

.card {

    background: #f4f6f9;

    font-weight: bold;
    border: 1px solid #ddd;
    transition: 0.3s;
}

.button:hover {
    background: #003366;
    color: white;
}

.primary {
    background: #0066cc;
    color: white;
    border: none;
}

.primary:hover {
